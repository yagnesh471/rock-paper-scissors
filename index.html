<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <h1>Rock, Paper, Scissors</h1>

    <div class="choices">
      <button class="choice-btn" data-choice="rock">✊ Rock</button>
      <button class="choice-btn" data-choice="paper">✋ Paper</button>
      <button class="choice-btn" data-choice="scissors">✌️ Scissors</button>
    </div>

    <div class="results">
      <p id="player-display">Your Choice: <span>-</span></p>
      <p id="computer-display">Computer Choice: <span>-</span></p>
      <h2 id="result-message">Choose an option to start!</h2>
    </div>

    <div class="scoreboard">
      <span>You: <strong id="player-score">0</strong></span>
      <span>Computer: <strong id="computer-score">0</strong></span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
